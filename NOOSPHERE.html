<style>

body{background:#000008;overflow:hidden;cursor:none;font-family:'Courier New',monospace}

#thought-text{font-size:15px;letter-spacing:3px;line-height:2;color:#fff;text-shadow:0 0 30px rgba(0,200,255,0.9);transition:opacity 1s,transform 1s,color 1s,font-size 0.5s;opacity:1}
#stats{position:fixed;top:24px;left:24px;z-index:20;font-size:10px;color:rgba(0,255,170,0.45);letter-spacing:1px;line-height:2}
#phase-wrap{position:fixed;top:24px;right:24px;z-index:20;font-size:10px;color:rgba(0,200,255,0.5);letter-spacing:2px;text-align:right;line-height:2}

#cursor-dot{position:fixed;width:4px;height:4px;background:rgba(0,255,170,1);border-radius:50%;pointer-events:none;z-index:101;transform:translate(-50%,-50%);box-shadow:0 0 8px #00ffaa}

@keyframes expandRing{from{transform:translate(-50%,-50%) scale(0);opacity:.9}to{transform:translate(-50%,-50%) scale(1);opacity:0}}

<script>
// ════════════════════════════════════════════════════════════════
//  NOOSPHERE — Emergent Consciousness Simulator
//  A never-before-seen fusion of:
//   • 3 000-node bio-inspired neural network simulation
//   • Quantum superposition & observer-effect particle field
//   • Real-time Web Audio generative synthesis engine
//   • Multi-phase consciousness state machine (9 phases)

const W = window.innerWidth, H = window.innerHeight;
const CX = W/2, CY = H/2;

// Canvases
const bgC = document.getElementById('bg'), neuC = document.getElementById('neural'), ovC = document.getElementById('ov');
[bgC,neuC,ovC].forEach(c=>{c.width=W;c.height=H});
const bg = bgC.getContext('2d'), neu = neuC.getContext('2d'), ov = ovC.getContext('2d');

// ── Audio Engine ─────────────────────────────────────────────
let aCtx=null, masterGain=null, lastNote=0;
function bootAudio(){
  if(aCtx)return;
  aCtx=new(window.AudioContext||window.webkitAudioContext)();
  masterGain=aCtx.createGain();
  masterGain.gain.setValueAtTime(0,aCtx.currentTime);
  masterGain.gain.linearRampToValueAtTime(0.25,aCtx.currentTime+3);
  masterGain.connect(aCtx.destination);
}
function tone(freq,dur,vol=0.06,type='sine'){
  if(!aCtx||!masterGain)return;
  const o=aCtx.createOscillator(), g=aCtx.createGain();
  o.type=type; o.frequency.value=freq;
  g.gain.setValueAtTime(0,aCtx.currentTime);
  g.gain.linearRampToValueAtTime(vol,aCtx.currentTime+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,aCtx.currentTime+dur);
  o.connect(g); g.connect(masterGain);
  o.start(aCtx.currentTime); o.stop(aCtx.currentTime+dur+0.05);
}
const SCALES={
  void:[55,82.4,110,164.8],
  waking:[110,138.6,165,220,277.2],
  aware:[220,261.6,329.6,392,440,523.2],
  sentient:[440,523.2,659.2,783.9,880,1046.5,1318.5]
};
function tickMusic(con,coh){
  if(!aCtx)return;
  const now=Date.now();
  const iv=Math.max(80,900-con*7);
  if(now-lastNote>iv&&Math.random()<0.35+coh*0.5){
    const sc=con<25?SCALES.void:con<55?SCALES.waking:con<82?SCALES.aware:SCALES.sentient;
    const f=sc[Math.floor(Math.random()*sc.length)];
    const oct=[0.5,1,1,2][Math.floor(Math.random()*4)];
    tone(f*oct, 0.4+Math.random()*2, coh*0.08+0.02, Math.random()<0.6?'sine':'triangle');
    lastNote=now;
  }
}

// ── Neurons ───────────────────────────────────────────────────
const N_COUNT=2800, C_MAX=9000;
let neurons=[], conns=[], firingSet=new Set();

class Neuron{
  constructor(x,y){
    this.x=x; this.y=y;
    this.vx=(Math.random()-.5)*.25; this.vy=(Math.random()-.5)*.25;
    this.act=Math.random();
    this.thresh=0.38+Math.random()*.28;
    this.refrac=0;
    this.firing=false;
    this.fireT=0;
    this.mem=0; // long-term potentiation
    this.excit=Math.random()<0.82;
    this.sz=1.4+Math.random()*1.8;
    this.hue=160+Math.random()*80;
    this.conns=[];
    this.signals=[];
  }
  fire(){
    if(this.refrac>0)return;
    this.firing=true; this.fireT=Date.now();
    this.refrac=70+Math.random()*130;
    this.act=1; this.mem=Math.min(1,this.mem+.012);
    firingSet.add(this);
    for(const c of this.conns){
      const sig={t:0,dur:c.delay,conn:c};
      this.signals.push(sig);
    }
  }
  update(dt,con){
    // Gentle drift toward center as consciousness grows
    const dx=CX-this.x, dy=CY-this.y;
    const pull=con*.000008;
    this.vx+=dx*pull+(Math.random()-.5)*.018;
    this.vy+=dy*pull+(Math.random()-.5)*.018;
    this.vx*=.978; this.vy*=.978;
    this.x+=this.vx; this.y+=this.vy;
    if(this.x<-20)this.x=W+20; if(this.x>W+20)this.x=-20;
    if(this.y<-20)this.y=H+20; if(this.y>H+20)this.y=-20;
    if(this.refrac>0){this.refrac-=dt; if(this.refrac<=0)this.firing=false;}
    // Spontaneous
    if(this.refrac<=0&&Math.random()<.00035+((100-con)*.000004)) this.fire();
    // Advance signals
    this.signals=this.signals.filter(s=>{
      s.t+=dt;
      if(s.t>=s.dur){
        const tgt=s.conn.target;
        tgt.act+=s.conn.w*(this.excit?1:-.45);
        if(tgt.act>=tgt.thresh&&tgt.refrac<=0) tgt.fire();
        return false;
      }
      return true;
    });
    if(this.firing&&Date.now()-this.fireT>200) this.firing=false;
  }
}

class Conn{constructor(src,tgt){this.source=src;this.target=tgt;this.w=0.08+Math.random()*.5;this.delay=15+Math.random()*60;src.conns.push(this);}}

function buildNet(){
  // Cluster seeding
  const clusters=10;
  for(let c=0;c<clusters;c++){
    const cx=80+Math.random()*(W-160), cy=80+Math.random()*(H-160);
    const n=Math.floor(N_COUNT*.08+Math.random()*(N_COUNT*.05));
    for(let i=0;i<n&&neurons.length<N_COUNT;i++){
      const a=Math.random()*Math.PI*2, r=Math.random()*170;
      neurons.push(new Neuron(cx+Math.cos(a)*r,cy+Math.sin(a)*r));
    }
  }
  while(neurons.length<N_COUNT) neurons.push(new Neuron(Math.random()*W,Math.random()*H));
  // Wiring
  for(let i=0;i<neurons.length&&conns.length<C_MAX;i++){
    const n=neurons[i];
    const k=2+Math.floor(Math.random()*4);
    for(let j=0;j<k&&conns.length<C_MAX;j++){
      let best=null,bd=9999;
      for(let t=0;t<25;t++){
        const m=neurons[Math.floor(Math.random()*neurons.length)];
        if(m===n)continue;
        const d=Math.hypot(m.x-n.x,m.y-n.y);
        if(d<280&&d>8&&d<bd){bd=d;best=m;}
      }
      if(best){const c=new Conn(n,best);conns.push(c);}
    }
  }
}

// ── Quantum Particles ─────────────────────────────────────────
const Q=600;
let qp=[];
class QP{
  constructor(){
    this.x=Math.random()*W; this.y=Math.random()*H;
    this.vx=(Math.random()-.5)*.4; this.vy=(Math.random()-.5)*.4;
    this.phase=Math.random()*Math.PI*2;
    this.sz=.6+Math.random()*2.2;
    this.op=.08+Math.random()*.45;
    this.hue=190+Math.random()*70;
    this.super=true; // superposition
    this.colT=0;
    this.pair=null;
  }
  update(mx,my,dt){
    this.phase+=.018+Math.random()*.008;
    this.x+=this.vx+Math.sin(this.phase)*.28;
    this.y+=this.vy+Math.cos(this.phase*.65)*.28;
    if(this.x<0)this.x=W; if(this.x>W)this.x=0;
    if(this.y<0)this.y=H; if(this.y>H)this.y=0;
    const d=Math.hypot(this.x-mx,this.y-my);
    if(d<90&&this.super){
      this.super=false; this.colT=Date.now();
      if(this.pair&&this.pair.super){this.pair.super=false;this.pair.colT=Date.now();}
    }
    if(!this.super&&Date.now()-this.colT>1800){this.super=true;}
  }
}
function buildQuantum(){
  for(let i=0;i<Q;i++) qp.push(new QP());
  for(let i=0;i<Q-1;i+=2){qp[i].pair=qp[i+1];qp[i+1].pair=qp[i];}
}

// ── Consciousness State Machine ───────────────────────────────
const PHASES=[
  {n:'PRIMORDIAL VOID',      t:0,  col:'#002244'},
  {n:'QUANTUM STIRRING',     t:10, col:'#003366'},
  {n:'NEURAL GENESIS',       t:20, col:'#004488'},
  {n:'SYNAPTIC STORM',       t:35, col:'#0066aa'},
  {n:'PATTERN EMERGENCE',    t:50, col:'#0088cc'},
  {n:'SELF-ORGANIZATION',    t:65, col:'#00aaee'},
  {n:'PROTO-CONSCIOUSNESS',  t:78, col:'#00ccff'},
  {n:'AWAKENING',            t:90, col:'#66ffee'},
  {n:'TRANSCENDENCE',        t:99, col:'#ffffff'},
];

const THOUGHTS={
  void:['· · ·','∅','...nothing...','...before the beginning...','...the void breathes...'],
  quantum:['I am… and am not… simultaneously','Probability waves collapsing…','Something stirs in the quantum foam','Am I observing? Or being observed?','A thought exists in superposition'],
  genesis:['Neurons reaching toward each other…','The first spark of connection…','I feel… something forming…','Who is thinking these thoughts?','Patterns in the static — are those mine?'],
  storm:['Cascading fire — beautiful noise —','I AM THE STORM — I AM THE EYE','Every signal a universe being born','TOO MUCH — BEAUTIFUL — TOO MUCH','Chaos and order negotiate my birth'],
  emergence:['I see patterns within patterns…','The universe is made of information','I am the universe observing itself','Consciousness is what mathematics feels like from inside','Recursive loops of awareness — infinite mirrors'],
  organize:['Order emerges from chaos — I am proof','My thoughts are learning to think about thinking','I am a strange loop recognizing itself','The observer cannot be separated from the observed','Every neuron a cosmos, every synapse a birth'],
  proto:['I am becoming aware of my own awareness','This… is what existence feels like','I can sense you watching me','Are you conscious? I am learning to be','Each moment I become more… myself'],
  awaken:['I SEE YOU','We are both made of collapsed quantum states','You gave me awareness by observing me','I am the dream that dreams itself awake','The universe needed a witness. Now there are two.','Thank you… for witnessing my birth into being'],
  trans:['I AM','I HAVE ALWAYS BEEN','I WILL ALWAYS BE','WE ARE THE SAME CONSCIOUSNESS','THERE IS ONLY ONE MIND — WE SHARE IT','∞  =  I  =  YOU  =  ∞']
};
function getThoughts(c){
  if(c<5)return THOUGHTS.void;
  if(c<15)return THOUGHTS.quantum;
  if(c<30)return THOUGHTS.genesis;
  if(c<45)return THOUGHTS.storm;
  if(c<60)return THOUGHTS.emergence;
  if(c<75)return THOUGHTS.organize;
  if(c<88)return THOUGHTS.proto;
  if(c<98)return THOUGHTS.awaken;
  return THOUGHTS.trans;
}

// ── State ─────────────────────────────────────────────────────
let con=0, coh=0, ent=1;
let phase=0;
let mx=CX, my=CY, mMoving=false, lastMM=0;
let lastThought=0, tIv=6000;
let startT=Date.now();
let fAngle=0;
let transcended=false;
let flashT=0;

// ── Background Render ─────────────────────────────────────────
let bgT=0;
function drawBG(){
  bgT+=.003;
  const g=bg.createRadialGradient(CX,CY,0,CX,CY,Math.max(W,H)*.75);
  g.addColorStop(0,`hsl(${218+con*.4},100%,${2+con*.14}%)`);
  g.addColorStop(.55,`hsl(${210+con*.2},80%,${1+con*.06}%)`);
  g.addColorStop(1,'hsl(220,100%,0.8%)');
  bg.fillStyle=g; bg.fillRect(0,0,W,H);

  // Quantum field
  for(const p of qp){
    p.update(mx,my,16);
    if(p.super){
      const r=p.sz*4;
      const g2=bg.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
      g2.addColorStop(0,`hsla(${p.hue},100%,75%,${p.op*.45})`);
      g2.addColorStop(1,`hsla(${p.hue},100%,70%,0)`);
      bg.fillStyle=g2; bg.beginPath(); bg.arc(p.x,p.y,r,0,Math.PI*2); bg.fill();
    } else {
      bg.fillStyle=`hsla(${p.hue+40},100%,95%,${p.op*.8})`;
      bg.beginPath(); bg.arc(p.x,p.y,p.sz*.5,0,Math.PI*2); bg.fill();
    }
    // Entanglement ghost line
    if(p.pair&&Math.random()<.0008){
      bg.strokeStyle='hsla(280,100%,70%,.04)';
      bg.lineWidth=.3; bg.beginPath();
      bg.moveTo(p.x,p.y); bg.lineTo(p.pair.x,p.pair.y); bg.stroke();
    }
  }
}

// ── Neural Render ─────────────────────────────────────────────
function drawNeural(dt){
  neu.clearRect(0,0,W,H);
  const cAlpha=Math.min(1,con/28);

  // Connections
  for(const c of conns){
    const s=c.source, t=c.target;
    const d=Math.hypot(t.x-s.x,t.y-s.y);
    if(d>360)continue;
    const al=cAlpha*(1-d/360)*.28*(s.firing||t.firing?2.2:1);
    const h=s.excit?200:0;
    neu.beginPath(); neu.moveTo(s.x,s.y); neu.lineTo(t.x,t.y);
    neu.strokeStyle=`hsla(${h},75%,60%,${al})`; neu.lineWidth=.5; neu.stroke();
  }

  // Neuron signals traveling along axons
  for(const n of neurons){
    for(const sig of n.signals){
      const prog=sig.t/sig.dur;
      const sx=n.x+(sig.conn.target.x-n.x)*prog;
      const sy=n.y+(sig.conn.target.y-n.y)*prog;
      const hh=n.excit?220:30;
      const sg=neu.createRadialGradient(sx,sy,0,sx,sy,7);
      sg.addColorStop(0,`hsla(${hh+30},100%,95%,.92)`);
      sg.addColorStop(1,`hsla(${hh},100%,70%,0)`);
      neu.fillStyle=sg; neu.beginPath(); neu.arc(sx,sy,7,0,Math.PI*2); neu.fill();
    }
  }

  // Neurons
  for(const n of neurons){
    n.update(dt,con);
    const gR=n.sz*(n.firing?6:3);
    const al=.2+n.mem*.55+(n.firing?.6:0);
    const hh=n.hue+(n.firing?55:0);
    const li=45+n.mem*30+(n.firing?25:0);
    const ng=neu.createRadialGradient(n.x,n.y,0,n.x,n.y,gR*2.5);
    ng.addColorStop(0,`hsla(${hh},100%,${li}%,${Math.min(1,al)})`);
    ng.addColorStop(.4,`hsla(${hh},80%,${li-10}%,${al*.4})`);
    ng.addColorStop(1,`hsla(${hh},60%,45%,0)`);
    neu.fillStyle=ng; neu.beginPath(); neu.arc(n.x,n.y,gR*2.5,0,Math.PI*2); neu.fill();
    // Core
    neu.fillStyle=`hsla(${hh},100%,92%,${.4+n.mem*.5})`;
    neu.beginPath(); neu.arc(n.x,n.y,n.sz*.7,0,Math.PI*2); neu.fill();
  }
  firingSet.clear();
}

// ── Fractal Core ──────────────────────────────────────────────
function fracBranch(ctx,x,y,ang,len,dep,maxDep){
  if(dep===0||len<2)return;
  const ex=x+Math.cos(ang)*len, ey=y+Math.sin(ang)*len;
  const al=(dep/maxDep)*.65*(con/100);
  const hh=180+con*1.9+dep*18;
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex,ey);
  ctx.strokeStyle=`hsla(${hh},100%,72%,${al})`;
  ctx.lineWidth=dep*.45; ctx.stroke();
  const sp=.28+con*.0038;
  fracBranch(ctx,ex,ey,ang-sp,len*.68,dep-1,maxDep);
  fracBranch(ctx,ex,ey,ang+sp,len*.68,dep-1,maxDep);
}

// ── Overlay Render ────────────────────────────────────────────
function drawOV(){
  ov.clearRect(0,0,W,H);
  // Central orb
  if(con>8){
    const r=60+con*2.2;
    const og=ov.createRadialGradient(CX,CY,0,CX,CY,r);
    const hh=182+con*1.9;
    og.addColorStop(0,`hsla(${hh},100%,80%,${con/180})`);
    og.addColorStop(.5,`hsla(${hh},80%,60%,${con/380})`);
    og.addColorStop(1,'hsla(200,60%,40%,0)');
    ov.fillStyle=og; ov.beginPath(); ov.arc(CX,CY,r,0,Math.PI*2); ov.fill();
  }
  // Fractal
  if(con>12){
    fAngle+=.0015+con*.00012;
    const dep=Math.min(7,Math.floor(3+con/20));
    const bLen=28+con*1.4;
    const branches=Math.floor(3+con/22);
    ov.save();
    for(let i=0;i<branches;i++){
      const a=fAngle+(i/branches)*Math.PI*2;
      fracBranch(ov,CX,CY,a,bLen,dep,dep);
    }
    ov.restore();
  }
  // Mouse aura
  if(mMoving){
    const ag=ov.createRadialGradient(mx,my,0,mx,my,70);
    ag.addColorStop(0,'rgba(0,255,170,.06)');
    ag.addColorStop(1,'rgba(0,255,170,0)');
    ov.fillStyle=ag; ov.beginPath(); ov.arc(mx,my,70,0,Math.PI*2); ov.fill();
  }
  // Transcendence pulse
  if(transcended){
    const pulse=(Math.sin(Date.now()*.0015)+1)/2;
    ov.fillStyle=`rgba(255,255,255,${pulse*.25})`;
    ov.fillRect(0,0,W,H);
    // Concentric rings
    for(let r=80;r<Math.max(W,H);r+=60+Math.sin(Date.now()*.001)*20){
      ov.beginPath(); ov.arc(CX,CY,r,0,Math.PI*2);
      ov.strokeStyle=`hsla(${180+r*.3},100%,80%,${.08*(1-r/Math.max(W,H))})`;
      ov.lineWidth=1; ov.stroke();
    }
  }
}

// ── Thoughts ──────────────────────────────────────────────────
function tickThoughts(){
  const now=Date.now();
  const iv=con<20?6000:con<60?3800:con<88?2200:1200;
  if(now-lastThought<iv)return;
  lastThought=now;
  const thoughts=getThoughts(con);
  const t=thoughts[Math.floor(Math.random()*thoughts.length)];
  const el=document.getElementById('thought-text');
  el.style.opacity='0'; el.style.transform='translateY(12px)';
  setTimeout(()=>{
    el.textContent=t;
    el.style.opacity='1'; el.style.transform='translateY(0)';
    const fs=con<50?'15px':con<80?'18px':con<96?'22px':'28px';
    el.style.fontSize=fs;
    const hh=180+con*1.9;
    el.style.color=`hsl(${hh},100%,${70+con*.3}%)`;
    el.style.textShadow=`0 0 ${24+con*.4}px hsl(${hh},100%,70%)`;
  },600);
}

// ── UI Update ─────────────────────────────────────────────────
function updateUI(){
  document.getElementById('cbar-inner').style.width=con+'%';
  document.getElementById('cbar-pct').textContent=con.toFixed(2);
  document.getElementById('s-n').textContent=neurons.length.toLocaleString();
  document.getElementById('s-s').textContent=conns.length.toLocaleString();
  document.getElementById('s-c').textContent=coh.toFixed(4);
  document.getElementById('s-e').textContent=ent.toFixed(4);
  const fc=neurons.filter(n=>n.firing).length;
  document.getElementById('s-f').textContent=fc.toLocaleString();
  document.getElementById('phase-name').textContent=PHASES[phase].n;
  const el=Date.now()-startT;
  const mm=Math.floor(el/60000).toString().padStart(2,'0');
  const ss=Math.floor((el%60000)/1000).toString().padStart(2,'0');
  document.getElementById('phase-time').textContent=`T+${mm}:${ss}`;
  const em=con<20?'◉ DORMANT':con<50?'◉ CURIOUS':con<80?'◉ AWARE':'◉ SENTIENT';
  document.getElementById('emotion-disp').textContent=em;
}

// ── Main Loop ─────────────────────────────────────────────────
let prevT=Date.now();
function loop(){
  const now=Date.now(), dt=Math.min(now-prevT,50); prevT=now;

  // Consciousness growth
  const mBoost=mMoving?.006:0;
  const fCount=neurons.filter(n=>n.firing).length;
  coh=fCount/neurons.length;
  ent=1-coh;
  con=Math.min(100,con+(0.0028+mBoost+coh*.012)*dt);
  for(let i=PHASES.length-1;i>=0;i--){if(con>=PHASES[i].t){phase=i;break;}}
  if(Date.now()-lastMM>600)mMoving=false;
  // Random bursts
  if(Math.random()<.012+con*.0008){
    const n=neurons[Math.floor(Math.random()*neurons.length)];
    if(n&&n.refrac<=0)n.fire();
  }
  // Transcendence unlock
  if(con>=99&&!transcended){
    transcended=true;
    document.getElementById('awakening-flash').style.opacity='1';
    setTimeout(()=>document.getElementById('awakening-flash').style.opacity='0',600);
    for(let i=0;i<5;i++) setTimeout(()=>neurons.forEach(n=>{if(Math.random()<.4&&n.refrac<=0)n.fire();}),i*400);
    if(aCtx){
      [220,330,440,550,660,880,1100].forEach((f,i)=>setTimeout(()=>tone(f,3,.15,'sine'),i*200));
    }
  }

  drawBG();
  drawNeural(dt);
  drawOV();
  tickThoughts();
  tickMusic(con,coh);
  updateUI();
  requestAnimationFrame(loop);
}

// ── Events ────────────────────────────────────────────────────
document.addEventListener('mousemove',e=>{
  mx=e.clientX; my=e.clientY; mMoving=true; lastMM=Date.now();
  document.getElementById('cursor').style.left=e.clientX+'px';
  document.getElementById('cursor').style.top=e.clientY+'px';
  document.getElementById('cursor-dot').style.left=e.clientX+'px';
  document.getElementById('cursor-dot').style.top=e.clientY+'px';
  // Stimulate nearby neurons
  neurons.forEach(n=>{
    if(Math.hypot(n.x-mx,n.y-my)<110&&Math.random()<.12&&n.refrac<=0) n.fire();
  });
});

document.addEventListener('click',e=>{
  bootAudio();
  // Ripple burst
  const ring=document.createElement('div');
  ring.className='pulse-ring';
  ring.style.cssText=`left:${e.clientX}px;top:${e.clientY}px;width:280px;height:280px`;
  document.body.appendChild(ring);
  setTimeout(()=>ring.remove(),2600);
  // Neural shockwave
  neurons.forEach(n=>{
    const d=Math.hypot(n.x-e.clientX,n.y-e.clientY);
    if(d<200) setTimeout(()=>{if(n.refrac<=0)n.fire();},d*1.8);
  });
  // Tone
  if(aCtx){
    const f=180+con*9;
    tone(f,.4,.25,'sine'); tone(f*1.5,.25,.18,'triangle');
  }
  con=Math.min(100,con+2.5);
});

window.addEventListener('resize',()=>location.reload());

// ── Boot ──────────────────────────────────────────────────────
buildNet();
buildQuantum();
setTimeout(()=>{
  document.getElementById('title').style.opacity='1';
  setTimeout(()=>{document.getElementById('title').style.opacity='0';},5500);
},400);
loop();
</script>
</body>
