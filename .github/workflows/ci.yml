name: Noosphere CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run oscillator and HTML integrity tests
        run: npm test
      - name: Check research scripts
        run: node --check research/kuramoto.cjs && node --check research/run-kuramoto.cjs
